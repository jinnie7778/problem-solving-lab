<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학급 갤러리 · 문제 해결 LAB</title><link rel="stylesheet" href="assets/site.css"><style>
.lesson2Card{border:1px solid #dfe6ef;border-radius:26px;background:#fff;overflow:hidden;box-shadow:0 14px 34px rgba(29,51,84,.09);display:flex;flex-direction:column}.lesson2Head{padding:18px 20px 15px;background:linear-gradient(180deg,#fbfdff,#f5f8ff);border-bottom:1px solid #e3e9f2}.lesson2Head.table{border-top:6px solid #315fdf}.lesson2Head.tree{border-top:6px solid #1b8a5a}.lesson2Head.graph{border-top:6px solid #7654d8}.lesson2Head .meta{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:#65758b}.authorLine{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.authorName{font-size:18px;font-weight:1000;color:#17243a}.groupBadge,.modelTag{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:950}.groupBadge{background:#eef2f7;color:#596a80}.modelTag{background:#eef3ff;color:#3159c7}.modelTag.tree{background:#eaf8f2;color:#176442}.modelTag.graph{background:#f2efff;color:#6044be}.lesson2Head h3{font-size:23px;line-height:1.35;margin:10px 0 5px;color:#17243a}.lesson2Head p{margin:0;color:#66768b;font-size:13px}.lesson2Body{padding:18px 20px;display:flex;flex-direction:column;gap:13px}.problemBox{padding:13px 14px;border-radius:16px;background:#f8fafc;border:1px solid #e1e7ef}.problemBox .miniLabel{margin-bottom:4px}.coreChips{display:flex;gap:6px;flex-wrap:wrap}.coreChips span{padding:6px 9px;border-radius:999px;background:#eef3ff;color:#3159c7;font-size:12px;font-weight:900}.modelPreviewWrap{position:relative}.modelPreviewLabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px;color:#68768a;font-weight:900}.modelPreview{border:1px solid #dfe6ef;border-radius:18px;background:#fbfdff;padding:12px;overflow:auto}.modelPreview table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}.modelPreview th,.modelPreview td{border:1px solid #d8e1ec;padding:7px;text-align:center}.modelPreview th{background:#eef3f9}.miniNet{position:relative;height:250px;background:#fff;border:1px solid #dfe6ef;border-radius:14px;overflow:hidden}.miniNet svg{position:absolute;inset:0;width:100%;height:100%}.miniNode{position:absolute;transform:translate(-50%,-50%);padding:6px 8px;border-radius:10px;border:2px solid #92a7c3;background:#fff;font-size:10px;font-weight:900;max-width:100px;text-align:center}.miniNode.root{background:#17243a;color:#fff;border-color:#17243a}.reasonBox{padding:12px 13px;border-radius:15px;background:#eefaf4;border:1px solid #c5e5d1;font-size:13px;line-height:1.55}.reflectionBox{padding:13px 14px;border-radius:16px;background:#fff9ed;border:1px solid #edd5a8}.reflectionBox .reflectionModels{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.reflectionModels span{padding:5px 8px;border-radius:999px;background:#fff1cf;color:#86580e;font-size:11px;font-weight:950}.reflectionBox p{margin:6px 0 0;color:#5e503d;font-size:13px;line-height:1.55}.members{font-size:12px;color:#68768a;margin-top:5px}.viewBtn{border:1px solid #dfe6ef;background:#fff;border-radius:12px;padding:9px 12px;font-weight:900}.galleryModal{position:fixed;inset:0;background:rgba(12,20,34,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.galleryModal.show{display:flex}.galleryModalCard{width:min(980px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:26px;padding:22px}.galleryModalTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.galleryModalTop h2{margin:0}.galleryModalModel{margin-top:16px}.galleryModal .miniNet{height:520px}.galleryModal .modelPreview table{font-size:15px}.galleryModal .modelPreview th,.galleryModal .modelPreview td{padding:11px}.galleryModal .problemBox,.galleryModal .reasonBox,.galleryModal .reflectionBox{font-size:15px}
</style></head>
<body><div class="shell">
  <div class="top"><div class="brand"><div class="logo">🖼️</div><div><h1>학급 갤러리</h1><p>친구들의 문제 해결 아이디어를 살펴보고 👍를 눌러보세요.</p></div></div><a class="back" href="index.html">← 홈으로</a></div>
  <section class="card">
    <div class="galleryHead"><div><h2 style="font-size:38px;margin:0">친구들의 문제 해결 카드</h2></div><div class="filters"><select id="galleryGrade"></select><select id="galleryClass"></select></div></div>
    <div class="tabs"><button class="tab active" data-lesson="1">1차시 · 내 상황 미션</button><button class="tab" data-lesson="2">2차시 · 모델링</button></div>
    <div id="galleryMsg" class="notice"></div><div id="galleryGrid" class="galleryGrid"></div>
  </section>
</div><div class="galleryModal" id="galleryModal"><div class="galleryModalCard"><div class="galleryModalTop"><div><h2 id="galleryModalTitle">작품 크게 보기</h2><div class="members" id="galleryModalMembers"></div></div><button class="viewBtn" id="galleryModalClose">닫기</button></div><div class="galleryModalModel" id="galleryModalModel"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/api.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const session=ProblemLabAPI.getStudentSession();if(!session){location.href='index.html'}
for(let i=1;i<=3;i++) $('#galleryGrade').insertAdjacentHTML('beforeend',`<option value="${i}" ${i===session.grade?'selected':''}>${i}학년</option>`);
for(let i=1;i<=12;i++) $('#galleryClass').insertAdjacentHTML('beforeend',`<option value="${i}" ${i===session.class_no?'selected':''}>${i}반</option>`);
let lessonNo=new URLSearchParams(location.search).get('lesson')==='2'?2:1, currentPosts=[];
$$('.tab').forEach(b=>b.classList.toggle('active',Number(b.dataset.lesson)===lessonNo));
const missionMeta={grade:['📚','다음 시험 성적 올리기'],soccer:['⚽','내가 감독이라면 우승하기'],trip:['🚆','친구들과 하루 여행 성공하기'],game:['🎮','게임 대회에서 이기기'],morning:['⏰','지각하지 않는 아침 만들기'],custom:['✨','나만의 문제']};
function showMsg(t,good=false){const e=$('#galleryMsg');e.textContent=t;e.className='notice show '+(good?'good':'bad')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function partsList(s){return esc(s||'').split(/\n+/).filter(Boolean).slice(0,6).map(x=>`<li>${x.replace(/^\s*\d+[.)]?\s*/, '')}</li>`).join('')}
function treePositions(d){const nodes=d?.nodes||[],edges=d?.edges||[];if(!nodes.length)return{};const root=nodes[0].id,children={};nodes.forEach(n=>children[n.id]=[]);edges.forEach(e=>(children[e.from]??=[]).push(e.to));const levels=[[root]],seen=new Set([root]);for(let k=0;k<8;k++){const next=[];(levels[k]||[]).forEach(id=>(children[id]||[]).forEach(c=>{if(!seen.has(c)){seen.add(c);next.push(c)}}));if(!next.length)break;levels.push(next)}nodes.forEach(n=>{if(!seen.has(n.id)){levels.push([n.id]);seen.add(n.id)}});const pos={};levels.forEach((arr,l)=>arr.forEach((id,i)=>{pos[id]={x:(i+1)*100/(arr.length+1),y:15+l*Math.min(22,70/Math.max(1,levels.length-1))}}));return pos}
function modelHtml(c,big=false){const d=c.modelData||{},type=c.modelType;if(type==='table'){return `<div class="modelPreview"><table><thead><tr>${(d.headers||[]).map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${(d.rows||[]).map(r=>`<tr>${r.map(x=>`<td>${esc(x||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}const tree=type==='tree',pos=tree?treePositions(d):Object.fromEntries((d.nodes||[]).map(n=>[n.id,{x:n.x,y:n.y}]));return `<div class="modelPreview"><div class="miniNet"><svg>${(d.edges||[]).map(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return'';return `<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%" stroke="#8ea2bd" stroke-width="2.5"/>`}).join('')}</svg>${(d.nodes||[]).map((n,i)=>`<div class="miniNode ${tree&&i===0?'root':''}" style="left:${pos[n.id]?.x||50}%;top:${pos[n.id]?.y||50}%">${esc(n.label)}</div>`).join('')}</div>${!tree&&(d.edges||[]).some(e=>e.label)?`<div class="coreChips">${d.edges.filter(e=>e.label).map(e=>{const a=d.nodes.find(n=>n.id===e.from)?.label||'',b=d.nodes.find(n=>n.id===e.to)?.label||'';return `<span>${esc(a)} ↔ ${esc(b)} · ${esc(e.label)}</span>`}).join('')}</div>`:''}</div>`}
function lesson2Card(p,i){const c=p.content||{},type=c.modelType||'table',typeName={table:'표',tree:'트리',graph:'그래프'}[type]||'모델',members=c.members||p.member_names||[],ref=c.reflection||{};const refNames=(ref.models||[]).map(x=>({table:'표',tree:'트리',graph:'그래프'}[x]||x));return `<article class="lesson2Card"><div class="lesson2Head ${type}"><div class="meta"><div class="authorLine"><span class="authorName">${esc(p.student_name||c.author_name||'학생')}</span><span class="groupBadge">${esc(p.group_name||c.group_name||'모둠')}</span><span class="modelTag ${type}">${typeName} 모델</span></div><span>${new Date(p.updated_at).toLocaleDateString('ko-KR')}</span></div><h3>${esc(c.title||c.problem||'문제해결 미션')}</h3><p>${members.length?`함께 활동한 조원 · ${esc(members.join(' · '))}`:'2차시 개인 작품'}</p></div><div class="lesson2Body"><div class="problemBox"><div class="miniLabel">해결할 문제</div>${esc(c.problem||c.title||'')}</div><div><div class="miniLabel">핵심 요소</div><div class="coreChips">${(Array.isArray(c.core)?c.core:[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><div class="modelPreviewWrap"><div class="modelPreviewLabel"><span>내가 만든 ${typeName}</span><span>미리보기</span></div>${modelHtml(c)}</div><div class="reasonBox"><div class="miniLabel">이 모델을 선택한 이유</div>${esc(c.reason||'')}</div>${ref.models?.length?`<div class="reflectionBox"><div class="miniLabel">💭 내 생각 정리</div><div class="reflectionModels">${refNames.map(x=>`<span>${esc(x)}</span>`).join('')}</div><p>${esc(ref.why||'')}</p>${ref.other?`<p><b>다른 모델로 바꾸면</b> · ${esc(ref.other)}</p>`:''}</div>`:''}<div class="likeRow" style="justify-content:space-between"><button class="viewBtn" data-view2="${i}">작품 크게 보기</button><button class="likeBtn ${p.liked_by_me?'liked':''}" data-id="${p.id}">👍 <span>${p.like_count||0}</span></button></div></div></article>`}
function openLesson2(post){const c=post.content||{},members=c.members||post.member_names||[],ref=c.reflection||{},typeName={table:'표',tree:'트리',graph:'그래프'}[c.modelType]||'모델',refNames=(ref.models||[]).map(x=>({table:'표',tree:'트리',graph:'그래프'}[x]||x));$('#galleryModalTitle').textContent=`${post.student_name||c.author_name||'학생'} · ${c.title||c.problem||'문제해결 미션'}`;$('#galleryModalMembers').textContent=`${post.group_name||c.group_name||'모둠'} · ${members.join(' · ')} · ${typeName} 모델`;$('#galleryModalModel').innerHTML=`<div class="problemBox"><div class="miniLabel">해결할 문제</div>${esc(c.problem||'')}</div><div style="margin-top:14px"><div class="miniLabel">핵심 요소</div><div class="coreChips">${(Array.isArray(c.core)?c.core:[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><div style="margin-top:14px">${modelHtml(c,true)}</div><div class="reasonBox" style="margin-top:14px"><div class="miniLabel">이 모델을 선택한 이유</div>${esc(c.reason||'')}</div>${ref.models?.length?`<div class="reflectionBox" style="margin-top:14px"><div class="miniLabel">💭 개인 생각 정리</div><div class="reflectionModels">${refNames.map(x=>`<span>${esc(x)}</span>`).join('')}</div><p>${esc(ref.why||'')}</p>${ref.other?`<p><b>다른 모델로 바꾸면</b> · ${esc(ref.other)}</p>`:''}</div>`:''}`;$('#galleryModal').classList.add('show')}
$('#galleryModalClose').onclick=()=>$('#galleryModal').classList.remove('show');$('#galleryModal').onclick=e=>{if(e.target===$('#galleryModal'))$('#galleryModal').classList.remove('show')};
async function loadGallery(){const grid=$('#galleryGrid');grid.innerHTML='<div class="empty">불러오는 중...</div>';const {data,error}=await ProblemLabAPI.galleryList({grade:$('#galleryGrade').value,classNo:$('#galleryClass').value,lessonNo});if(error||!data?.ok){grid.innerHTML='';showMsg('갤러리를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');return}$('#galleryMsg').className='notice';const posts=data.posts||[];currentPosts=posts;if(!posts.length){grid.innerHTML=`<div class="empty">${lessonNo===1?'아직 이 반에 올라온 1차시 작품이 없어요.':'아직 이 반에 올라온 2차시 작품이 없어요.'}</div>`;return}if(lessonNo===2){grid.innerHTML=posts.map(lesson2Card).join('');$$('[data-view2]').forEach(b=>b.onclick=()=>openLesson2(currentPosts[+b.dataset.view2]));}else{grid.innerHTML=posts.map(p=>{const c=p.content||{}, meta=missionMeta[c.mission_id]||['✨',c.mission_title||'문제 해결'];return `<article class="workCard ${esc(c.mission_id||'custom')}"><div class="author"><div><b>${esc(p.student_name)}</b><br><span>${p.grade}학년 ${p.class_no}반</span></div><span>${new Date(p.updated_at).toLocaleDateString('ko-KR')}</span></div><div style="font-size:34px">${meta[0]}</div><h3>${esc(c.mission_title||meta[1])}</h3><div class="workBlock"><div class="miniLabel">해결해야 하는 문제</div>${esc(c.problem)}</div><div class="arrowGoal"><div><div class="miniLabel">현재 상태</div>${esc(c.current_state)}</div><b>→</b><div><div class="miniLabel">목표 상태</div>${esc(c.goal_state)}</div></div><div class="workBlock"><div class="miniLabel">핵심 요소</div>${esc(c.core_elements)}</div><div class="workBlock"><div class="miniLabel">문제 분해</div><ol class="parts">${partsList(c.parts)}</ol></div><div class="workBlock"><div class="miniLabel">한 줄 성찰</div>${esc(c.reflection)}</div><div class="likeRow" style="justify-content:flex-end"><button class="likeBtn ${p.liked_by_me?'liked':''}" data-id="${p.id}">👍 <span>${p.like_count||0}</span></button></div></article>`}).join('')}$$('.likeBtn').forEach(b=>b.onclick=async()=>{b.disabled=true;const {data,error}=await ProblemLabAPI.toggleLike(b.dataset.id);b.disabled=false;if(error||!data?.ok){showMsg('👍를 반영하지 못했어요. 다시 눌러 주세요.');return}b.classList.toggle('liked',!!data.liked);b.querySelector('span').textContent=data.like_count;});}
$$('.tab').forEach(b=>b.onclick=()=>{lessonNo=+b.dataset.lesson;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));loadGallery()});$('#galleryGrade').onchange=loadGallery;$('#galleryClass').onchange=loadGallery;loadGallery();
</script></body></html>
