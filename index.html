<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문제 해결 LAB</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><div class="logo">3</div><div><h1>문제 해결 LAB</h1><p>알고리즘과 프로그래밍 · 문제 해결 프로젝트</p></div></div>
  </div>

  <section class="card hero">
    <span class="eyebrow">3단원 학습 공간</span>
    <h2>내 문제를 이해하고,<br>친구들의 해결 방법도 만나보자.</h2>
    <p>학년·반·이름과 <b>숫자 4자리 PIN</b>을 입력하고 시작하세요.</p>
  </section>

  <section id="loginArea" class="wizard">
    <div class="stepCard active">
      <h3>1. 학년 · 반 선택</h3>
      <div class="row">
        <div class="field"><label>학년</label><select id="grade"></select></div>
        <div class="field"><label>반</label><select id="classNo"></select></div>
      </div>
    </div>
    <div class="stepCard active">
      <h3>2. 내 정보 · 4자리 PIN</h3>
      <div class="field"><label>이름</label><input id="studentName" maxlength="30" placeholder="예: 홍길동" autocomplete="off"></div>
      <div class="field"><label>숫자 4자리 PIN</label><input id="studentPin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="● ● ● ●" type="password" autocomplete="off"></div>
      <div class="notice show">처음이면 사용할 PIN을 정하고, 다음부터 같은 PIN으로 접속하세요.</div>
      <div class="actions"><button class="btn" id="loginBtn">내 학습 공간 들어가기</button></div>
      <div class="notice" id="loginMsg"></div>
    </div>
  </section>

  <section id="dashboard" class="dashboard">
    <div class="studentBar">
      <div><b id="studentLabel"></b></div>
      <div class="actions" style="margin:0"><button class="ghost" id="switchStudent">학생 바꾸기</button></div>
    </div>
    <div class="menuGrid">
      <button class="menuCard" id="lesson1Card"><div class="ico">🧩</div><h3>1차시 · 개별활동</h3><p>문제를 이해하고 핵심을 찾은 뒤 작은 문제로 나누어 봅니다.</p><span class="badge" id="lesson1Badge">활동 시작</span></button>
      <button class="menuCard locked" id="lesson2Card"><div class="ico">🗺️</div><h3>2차시 · 모둠활동</h3><p>선생님이 공개하면 시작할 수 있습니다.</p><span class="badge" id="lesson2Badge">아직 열리지 않음</span></button>
      <button class="menuCard" id="galleryCard"><div class="ico">🖼️</div><h3>학급 갤러리</h3><p>친구들의 결과물을 보고 마음에 드는 작품에 👍를 눌러보세요.</p><span class="badge">작품 보기</span></button>
    </div>
    <div class="notice" id="dashboardMsg"></div>
  </section>
</div>

<button class="teacherFab" id="teacherOpen" title="교사 콘솔">🧑‍🏫</button>
<div class="modal" id="teacherModal"><div class="modalCard">
  <div class="modalTitle"><div><h2>교사 콘솔</h2><p style="color:var(--muted);margin:5px 0 0">2차시 공개 · 기록 다운로드</p></div><button class="ghost" id="teacherClose">닫기</button></div>
  <div id="teacherLoginBox">
    <div class="field" style="max-width:320px"><label>교사 PIN</label><input id="teacherPin" type="password" inputmode="numeric" maxlength="8" placeholder="교사 PIN"></div>
    <div class="actions" style="justify-content:flex-start"><button class="btn" id="teacherLoginBtn">교사 콘솔 열기</button></div>
    <div class="notice" id="teacherMsg"></div>
  </div>
  <div id="teacherBody" class="hide">
    <div class="teacherGrid">
      <div class="teacherBox"><h3>2차시 공개</h3><div class="toggleRow"><div><b>학생에게 2차시 버튼 열기</b></div><label class="switch"><input type="checkbox" id="lesson2Toggle"><span class="slider"></span></label></div></div>
      <div class="teacherBox"><h3>기록 다운로드</h3><div class="row"><div class="field"><label>학년</label><select id="exportGrade"><option value="">전체</option><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select></div><div class="field"><label>반</label><select id="exportClass"><option value="">전체</option></select></div></div><div class="actions" style="justify-content:flex-start"><button class="btn" id="downloadCsv">1차시 기록 CSV</button></div></div>
    </div>
    <div class="notice" id="teacherActionMsg"></div>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/api.js"></script>
<script>
const $=s=>document.querySelector(s);
for(let i=1;i<=3;i++) $('#grade').insertAdjacentHTML('beforeend',`<option value="${i}" ${i===1?'selected':''}>${i}학년</option>`);
for(let i=1;i<=12;i++){ $('#classNo').insertAdjacentHTML('beforeend',`<option value="${i}">${i}반</option>`); $('#exportClass').insertAdjacentHTML('beforeend',`<option value="${i}">${i}반</option>`); }
function msg(el,text,good=false){el.textContent=text;el.className='notice show '+(good?'good':'bad')}
function setDashboard(session, data={}){
  $('#loginArea').style.display='none';$('#dashboard').classList.add('show');
  $('#studentLabel').textContent=`${session.grade}학년 ${session.class_no}반 · ${session.name}`;
  $('#lesson1Badge').textContent=data.lesson1_passed?'형성평가 완료':(data.lesson1_started?'이어서 하기':'활동 시작');
  const open=!!data.lesson2_open; $('#lesson2Card').classList.toggle('locked',!open);$('#lesson2Card').classList.toggle('open',open);$('#lesson2Badge').textContent=open?'열림':'아직 열리지 않음';
}
async function refreshDashboard(){const s=ProblemLabAPI.getStudentSession();if(!s)return;const {data,error}=await ProblemLabAPI.getDashboard();if(error||!data?.ok){ProblemLabAPI.clearStudentSession();$('#loginArea').style.display='grid';$('#dashboard').classList.remove('show');return}setDashboard(s,data)}
const current=ProblemLabAPI.getStudentSession();if(current) refreshDashboard();
$('#loginBtn').onclick=async()=>{
  const name=$('#studentName').value.trim(), pin=$('#studentPin').value.trim();
  if(!name){msg($('#loginMsg'),'이름을 입력해 주세요.');return} if(!/^\d{4}$/.test(pin)){msg($('#loginMsg'),'PIN은 숫자 4자리로 입력해 주세요.');return}
  $('#loginBtn').disabled=true;$('#loginBtn').textContent='확인 중...';
  const {data,error}=await ProblemLabAPI.studentLogin({grade:$('#grade').value,classNo:$('#classNo').value,name,pin});
  $('#loginBtn').disabled=false;$('#loginBtn').textContent='내 학습 공간 들어가기';
  if(error){msg($('#loginMsg'),'지금은 접속할 수 없습니다. 선생님께 알려주세요.');return}
  if(!data?.ok){msg($('#loginMsg'),data?.message||'로그인하지 못했습니다.');return}
  await refreshDashboard();
};
$('#switchStudent').onclick=()=>{ProblemLabAPI.clearStudentSession();location.reload()};
$('#lesson1Card').onclick=()=>location.href='lesson1.html';
$('#galleryCard').onclick=()=>location.href='gallery.html';
$('#lesson2Card').onclick=()=>{if($('#lesson2Card').classList.contains('locked'))return;msg($('#dashboardMsg'),'2차시 활동은 아직 준비 중이에요.');};

let teacherPin='';
$('#teacherOpen').onclick=()=>$('#teacherModal').classList.add('show');$('#teacherClose').onclick=()=>$('#teacherModal').classList.remove('show');
$('#teacherLoginBtn').onclick=async()=>{teacherPin=$('#teacherPin').value.trim();const {data,error}=await ProblemLabAPI.teacherVerify(teacherPin);if(error){msg($('#teacherMsg'),`연결 오류: ${error.message}`);return}if(!data?.ok){msg($('#teacherMsg'),'교사 PIN이 맞지 않습니다.');return}$('#teacherLoginBox').classList.add('hide');$('#teacherBody').classList.remove('hide');$('#lesson2Toggle').checked=!!data.lesson2_open};
$('#lesson2Toggle').onchange=async()=>{const {data,error}=await ProblemLabAPI.teacherSetLesson2(teacherPin,$('#lesson2Toggle').checked);if(error||!data?.ok){msg($('#teacherActionMsg'),data?.message||error?.message||'변경 실패');$('#lesson2Toggle').checked=!$('#lesson2Toggle').checked;return}msg($('#teacherActionMsg'),data.lesson2_open?'2차시 버튼을 학생에게 공개했습니다.':'2차시 버튼을 다시 잠갔습니다.',true);refreshDashboard()};
function csvEscape(v){const s=String(v??'').replace(/\r?\n/g,' / ');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
$('#downloadCsv').onclick=async()=>{const {data,error}=await ProblemLabAPI.teacherExport(teacherPin,$('#exportGrade').value,$('#exportClass').value);if(error||!data?.ok){msg($('#teacherActionMsg'),data?.message||error?.message||'다운로드 실패');return}const rows=data.rows||[];const heads=['학년','반','이름','최종탭','내상황미션','문제','현재상태','목표상태','조건','핵심요소','문제분해','성찰','형성평가시도','형성평가오답','형성평가통과','마지막저장'];const lines=[heads.join(',')];for(const x of rows){const r=x.record||{},a=r.activity||{},q=r.quiz||{},st=r.state||{};lines.push([x.grade,x.class_no,x.name,st.stage??'',a.mission_title||a.mission_id||'',a.problem||'',a.current_state||'',a.goal_state||'',a.conditions||'',a.core_elements||'',a.parts||'',a.reflection||'',q.attempts??'',q.wrong_total??'',q.passed??false,x.updated_at||''].map(csvEscape).join(','))}const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`문제해결LAB_1차시_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);msg($('#teacherActionMsg'),`${rows.length}명 기록을 내려받았습니다.`,true)};
</script>
</body></html>
